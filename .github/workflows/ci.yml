name: CI

# The deploy workflows only run after a merge to main, so until now nothing
# checked a pull request. This gates the merge instead of the deployment.
on:
  pull_request:
    paths:
      - 'devdash/frontend/**'
      - 'devdash/backend/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'devdash/frontend/**'
      - 'devdash/backend/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devdash/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devdash/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devdash/backend

    # The app reads its config through pydantic-settings, and SECRET_KEY and
    # DATABASE_URL are declared with no defaults — so importing app.main raises a
    # ValidationError unless they are set. Locally that is masked by python-dotenv
    # finding devdash/.env, which is gitignored and therefore absent here.
    # These are throwaway values: conftest.py overrides get_db with in-memory
    # SQLite, so DATABASE_URL is never connected to. It only has to parse.
    env:
      SECRET_KEY: ci-test-secret-not-used-for-anything
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Lambda base image (public.ecr.aws/lambda/python:3.11),
          # not whatever is installed locally.
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: devdash/backend/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest
