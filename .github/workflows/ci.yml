name: CI

# The deploy workflows only run after a merge to main, so until now nothing
# checked a pull request. This gates the merge instead of the deployment.
on:
  pull_request:
    paths:
      - 'devdash/frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'devdash/frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devdash/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devdash/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run
